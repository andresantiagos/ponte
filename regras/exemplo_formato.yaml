        tipo: sem_possibilidade_aparente
        texto_base: "Com essas respostas, não encontramos um caminho aparente. [texto pendente de validação]"
      prefere_nao_responder:
        tipo: encaminhar_cras
        texto_base: "Sem problema. Se quiser, o CRAS pode orientar. [texto pendente de validação]"
    fonte_oficial: pendente
    data_fonte: pendente
    validado_por: pendente
    data_validacao: pendente
