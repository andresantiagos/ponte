versao_arvore: "0000.00.00"
ramo: exemplo

regras:
  - id: exemplo.gravidez_confirmada
    status: rascunho
    pergunta: "Você está grávida no momento?"
    opcoes:
      - sim
      - nao
      - prefere_nao_responder
    desfechos:
      sim:
        tipo: encaminhar_cras
        texto_base: "Vamos verificar os caminhos de orientação. [texto pendente de validação]"
